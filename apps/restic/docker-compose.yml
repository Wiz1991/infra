x-logging: &logging
  driver: json-file
  options:
    labels: service.name,service.namespace,otel.logs
    max-size: "10m"
    max-file: "3"

services:
  restic_backup:
    image: mazzolino/restic:1.7.2
    container_name: restic_backup
    # Pin the hostname so every snapshot is tagged host=homelab. Without it the
    # snapshot host is the random container ID, which changes on each recreate
    # and breaks restic's parent-snapshot detection (every run re-reads all
    # files instead of diffing against the previous snapshot).
    hostname: ${HOST_NAME:-homelab}
    logging: *logging
    labels:
      - service.name=restic_backup
      - service.namespace=infra
    environment:
      - TZ=${TZ}
      - RESTIC_REPOSITORY=s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET_NAME}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      # /data = app config (/srv/homelab). /library/* = the debrid symlink farm
      # and hardlink library (the curated *arr->debrid mapping). restic stores
      # symlinks as their target string, so the 5.5k symlinks cost ~34M, not the
      # petabytes they point at. The FUSE mount at /mnt/media/remote is NEVER
      # mounted here, so it can't be traversed.
      - RESTIC_BACKUP_SOURCES=/data /library/symlinks /library/hardlinks
      # --one-file-system is a belt-and-braces guard: even if a mount ever
      # appeared under a source, restic won't cross into it.
      - RESTIC_BACKUP_ARGS=--exclude-file /excludes.txt --one-file-system --verbose
      - BACKUP_CRON=0 0 2 * * *
      - RUN_ON_STARTUP=false
    volumes:
      - ${APPDATA_DIR}:/data:ro
      - /mnt/media/symlinks:/library/symlinks:ro
      - /mnt/media/hardlinks:/library/hardlinks:ro
      - ./config/excludes.txt:/excludes.txt:ro
    restart: unless-stopped

  restic_prune:
    image: mazzolino/restic:1.7.2
    container_name: restic_prune
    hostname: ${HOST_NAME:-homelab}
    logging: *logging
    labels:
      - service.name=restic_prune
      - service.namespace=infra
    environment:
      - TZ=${TZ}
      - RESTIC_REPOSITORY=s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET_NAME}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - PRUNE_CRON=0 0 4 * * 0
      - RESTIC_FORGET_ARGS=--keep-daily 7 --keep-weekly 4 --keep-monthly 6 --keep-yearly 2
    restart: unless-stopped
