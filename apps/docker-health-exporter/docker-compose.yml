# Container health, which nothing else in the stack reports: the otel docker_stats
# receiver gives CPU/memory/restarts but not healthcheck state, so a container can
# fail its own healthcheck or sit in a restart loop entirely unmonitored.
# Scraped by the otel-collector as job `docker`. See config/exporter.py.
x-logging: &logging
  driver: json-file
  options:
    labels: service.name,service.namespace,otel.logs
    max-size: "10m"
    max-file: "3"

services:
  docker_health_exporter:
    image: python:3.12-alpine
    container_name: docker_health_exporter
    logging: *logging
    labels:
      - service.name=docker_health_exporter
      - service.namespace=observability
    command: ["python", "-u", "/app/exporter.py"]
    volumes:
      - ./config/exporter.py:/app/exporter.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      disable: true
    mem_limit: 128m
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
