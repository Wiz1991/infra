x-logging: &logging
  driver: json-file
  options:
    labels: service.name,service.namespace,otel.logs
    max-size: "10m"
    max-file: "3"

services:
  decypharr:
    image: ghcr.io/sirrobot01/decypharr:v1.1.6
    container_name: decypharr
    logging: *logging
    init: true
    # Hard cap: with no limit it sat at 4-5G for days and peaked at 5.2G on
    # 2026-09-16, which pushed the host into a swap-thrash livelock. Better to
    # have the kernel OOM-kill this one container (docker restarts it) than
    # lose the box.
    mem_limit: 3g
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /mnt/media:/mnt:rshared
      - ${APPDATA_DIR}/decypharr:/app
      - ./healthcheck.sh:/usr/local/bin/healthcheck-full:ro
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    labels:
      - traefik.enable=true
      - traefik.http.routers.decypharr.rule=Host(`decypharr.${DOMAIN_NAME}`)
      - traefik.http.routers.decypharr.entrypoints=websecure
      - traefik.http.routers.decypharr.tls.certresolver=letsencrypt
      - traefik.http.routers.decypharr.middlewares=security-headers@file
      - traefik.http.services.decypharr.loadbalancer.server.port=8282
      - service.name=decypharr
      - otel.logs=stdout
      - service.namespace=debrid
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck-full"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
