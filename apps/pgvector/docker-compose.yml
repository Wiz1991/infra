x-logging: &logging
  driver: json-file
  options:
    labels: service.name,service.namespace,otel.logs
    max-size: "10m"
    max-file: "3"

services:
  pgvector:
    image: pgvector/pgvector:pg17-bookworm
    container_name: pgvector
    logging: *logging
    labels:
      - service.name=pgvector
      - service.namespace=infra
    restart: unless-stopped
    shm_size: 4g
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${APPDATA_DIR}/pgvector:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./config/postgresql.conf:/etc/postgresql/pgvector.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/pgvector.conf
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    logging: *logging
    # Leaks ~50M/day (was at 915M before the 2026-09-16 hang, 20M fresh).
    # Cap it; the OOM kill + restart is the cheapest fix.
    mem_limit: 128m
    labels:
      - service.name=postgres_exporter
      - service.namespace=observability
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: pgvector:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:9187/metrics || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - traefik

networks:
  traefik:
    external: true
