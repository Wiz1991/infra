x-logging: &logging
  driver: json-file
  options:
    labels: service.name,service.namespace,otel.logs
    max-size: "10m"
    max-file: "3"

services:
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    logging: *logging
    labels:
      - service.name=byparr
      - service.namespace=debrid
    init: true
    # Headless Firefox; observed up to 1.8G. Cap so a stuck solve can't eat the host.
    mem_limit: 1500m
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-sf", "--max-time", "15", "http://localhost:8191/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - traefik
    restart: unless-stopped

networks:
  traefik:
    external: true
